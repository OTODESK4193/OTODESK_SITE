<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wavetable v1.1.0 — OTODESK | Polyphonic Wavetable Synthesizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&family=Geist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #070709;
      --bg2: #0e0e12;
      --bg3: #14141a;
      --ink: #f0eee6;
      --dim: #706f68;
      --dim2: #929088;
      --rule: rgba(255, 255, 255, 0.08);
      --rule-bright: rgba(255, 255, 255, 0.16);
      --accent: #00d4ff;
      --accent-glow: rgba(0, 212, 255, 0.25);
      --accent-dim: rgba(0, 212, 255, 0.08);
      --accent-border: rgba(0, 212, 255, 0.4);
      --mono: "Geist Mono", monospace;
      --sans: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; height: auto; }

    /* NAVIGATION */
    .site-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      background: rgba(7, 7, 9, 0.92);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--rule);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.12em;
    }
    .nav-brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
    .nav-brand-name { font-weight: 700; color: var(--ink); }
    .nav-brand-sub { color: var(--dim2); }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .lang-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      font-family: var(--mono);
      font-size: 11px;
      padding: 5px 12px;
      border: 1px solid var(--rule);
      border-radius: 20px;
      background: rgba(255,255,255,0.02);
      cursor: pointer;
      color: var(--dim2);
      transition: all 0.2s;
    }
    .lang-toggle:hover {
      border-color: var(--dim2);
      color: var(--ink);
    }
    .lang-toggle .active {
      color: var(--accent);
      font-weight: 600;
    }
    .nav-back {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--dim2);
      transition: color 0.2s;
    }
    .nav-back:hover { color: var(--accent); }

    /* HERO */
    .hero {
      padding: 130px 40px 60px;
      max-width: 1240px;
      margin: 0 auto;
    }
    .hero-meta {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--accent);
      border: 1px solid var(--accent-border);
      background: var(--accent-dim);
      border-radius: 4px;
    }
    .hero-badge-pulse {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }
    .hero-version {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--dim2);
      letter-spacing: 0.08em;
    }

    .hero-headline {
      font-size: clamp(48px, 8vw, 104px);
      font-weight: 900;
      line-height: 0.94;
      letter-spacing: -0.05em;
      margin-bottom: 24px;
      color: var(--ink);
    }
    .hero-subheadline {
      font-size: clamp(22px, 3.2vw, 36px);
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.02em;
      color: var(--accent);
      margin-bottom: 24px;
      max-width: 960px;
    }
    .hero-paragraph {
      font-size: 17px;
      line-height: 1.8;
      color: var(--dim2);
      max-width: 820px;
      font-weight: 300;
      margin-bottom: 40px;
    }

    .hero-buttons {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 56px;
    }
    .btn-disabled {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--dim);
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--rule);
      cursor: not-allowed;
      border-radius: 4px;
    }
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--ink);
      border: 1px solid var(--rule);
      border-radius: 4px;
      transition: all 0.2s;
    }
    .btn-ghost:hover {
      border-color: var(--dim2);
      background: rgba(255,255,255,0.03);
    }

    /* MAIN SCREENSHOT CONTAINER */
    .hero-preview {
      position: relative;
      border: 1px solid var(--rule-bright);
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg2);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 40px var(--accent-glow);
      margin-bottom: 96px;
    }
    .hero-preview img {
      width: 100%;
      display: block;
    }
    .hero-preview-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(14, 14, 18, 0.95);
      border-bottom: 1px solid var(--rule);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--dim2);
    }

    /* SECTION BASICS */
    .section-wrap {
      max-width: 1240px;
      margin: 0 auto;
      padding: 40px 40px 100px;
    }
    .section-eyebrow {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.16em;
      color: var(--accent);
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    .section-heading {
      font-size: clamp(32px, 4.5vw, 56px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 48px;
    }

    /* TAB CONTROL (ABLETON STYLE) */
    .tab-navigator {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 16px;
      margin-bottom: 40px;
      border-bottom: 1px solid var(--rule);
      scrollbar-width: thin;
    }
    .tab-btn {
      padding: 12px 22px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--rule);
      border-radius: 4px;
      color: var(--dim2);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tab-btn:hover {
      color: var(--ink);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .tab-btn.active {
      color: var(--accent);
      background: var(--accent-dim);
      border-color: var(--accent);
      font-weight: 600;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    .tab-tag-new {
      padding: 2px 6px;
      font-size: 9px;
      border-radius: 3px;
      background: #ff5b35;
      color: #fff;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    /* TAB PANEL CONTENT */
    .tab-panel {
      background: var(--bg2);
      border: 1px solid var(--rule-bright);
      border-radius: 8px;
      padding: 48px;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel-header {
      margin-bottom: 36px;
    }
    .panel-meta {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.12em;
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .panel-catchphrase {
      font-size: clamp(28px, 4vw, 48px);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -0.03em;
      color: var(--ink);
      margin-bottom: 20px;
    }
    .panel-desc {
      font-size: 17px;
      line-height: 1.8;
      color: var(--dim2);
      max-width: 880px;
      font-weight: 300;
      margin-bottom: 28px;
    }

    .badge-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 36px;
    }
    .pill-badge {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--rule);
      color: var(--ink);
    }
    .pill-badge.highlight {
      border-color: var(--accent-border);
      color: var(--accent);
      background: var(--accent-dim);
    }

    .panel-image-wrap {
      border: 1px solid var(--rule);
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }

    /* SUB-TABS (MODULATION / FORMULA) */
    .sub-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .sub-tab-btn {
      font-family: var(--mono);
      font-size: 11px;
      padding: 6px 14px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: transparent;
      color: var(--dim2);
      cursor: pointer;
      transition: all 0.15s;
    }
    .sub-tab-btn:hover { color: var(--ink); }
    .sub-tab-btn.active {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    /* INNOVATION GRID */
    .inno-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 48px;
    }
    .inno-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      padding: 32px;
      border-radius: 6px;
      transition: border-color 0.2s;
    }
    .inno-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
    }
    .inno-num {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .inno-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }
    .inno-desc {
      font-size: 14px;
      color: var(--dim2);
      line-height: 1.7;
      font-weight: 300;
    }

    /* SPECS TABLE */
    .specs-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      margin-top: 24px;
    }
    .specs-table th, .specs-table td {
      padding: 16px 20px;
      border-bottom: 1px solid var(--rule);
      text-align: left;
    }
    .specs-table th {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--accent);
      text-transform: uppercase;
      background: rgba(255, 255, 255, 0.02);
    }
    .specs-table td {
      color: var(--dim2);
    }
    .specs-table tr:hover td {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.01);
    }

    /* SIGNAL FLOW DIAGRAM */
    .flow-card {
      background: var(--bg2);
      border: 1px solid var(--rule);
      padding: 36px;
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.9;
      color: var(--dim2);
      overflow-x: auto;
      white-space: pre;
      margin-top: 32px;
    }
    .flow-highlight {
      color: var(--accent);
      font-weight: 600;
    }

    /* FOOTER */
    .site-footer {
      border-top: 1px solid var(--rule);
      padding: 64px 40px;
      text-align: center;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--dim);
    }
    .footer-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 20px;
      font-size: 13px;
    }
    .footer-links a {
      color: var(--dim2);
      transition: color 0.2s;
    }
    .footer-links a:hover { color: var(--accent); }

    @media (max-width: 768px) {
      .site-nav { padding: 16px 20px; }
      .hero { padding: 110px 20px 40px; }
      .section-wrap { padding: 20px 20px 60px; }
      .tab-panel { padding: 24px; }
      .panel-catchphrase { font-size: 26px; }
      .panel-desc { font-size: 15px; }
    }
  </style>
</head>

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
