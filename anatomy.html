<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANATOMY — OTODESK | Transient / Tonal Separation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #060608;
      --bg2: #0d0d12;
      --ink: #e4e4e8;
      --dim: #666674;
      --rule: rgba(255,255,255,0.07);
      --cyan: #22d3ee;
      --magenta: #e879f9;
      --accent: #c084fc;
      --mono: "Geist Mono", monospace;
      --sans: "Geist", system-ui, sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    img { display: block; }

    /* NAV */
    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 20px 48px; background: rgba(6,6,8,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--rule); }
    .nav-logo { font-family: var(--mono); font-size: 13px; letter-spacing: 0.12em; color: var(--dim); text-decoration: none; }
    .nav-logo span { color: var(--ink); }
    .nav-right { display: flex; align-items: center; gap: 24px; }
    .nav-back { font-family: var(--mono); font-size: 12px; color: var(--dim); text-decoration: none; letter-spacing: 0.05em; }
    .nav-back:hover { color: var(--ink); }
    .lang-btn { background: none; border: 1px solid var(--rule); color: var(--dim); font-family: var(--mono); font-size: 11px; padding: 5px 10px; cursor: pointer; letter-spacing: 0.08em; }
    .lang-btn.active { border-color: var(--accent); color: var(--accent); }

    /* HERO */
    .hero { position: relative; min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 0 80px; overflow: hidden; }
    .hero-bg { position: absolute; inset: 0; }
    .hero-bg img { width: 100%; height: 100%; object-fit: cover; object-position: top; opacity: 0.22; filter: saturate(1.4); }
    .hero-bg-grad { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(6,6,8,0.3) 0%, rgba(6,6,8,0.5) 40%, rgba(6,6,8,0.97) 85%, var(--bg) 100%); }
    .hero-content { position: relative; max-width: 1080px; margin: 0 auto; padding: 0 48px; width: 100%; }
    .hero-badge { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 28px; padding: 6px 14px; border: 1px solid rgba(192,132,252,0.3); background: rgba(192,132,252,0.07); }
    .hero-badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .hero-title { font-size: clamp(48px, 7vw, 88px); font-weight: 800; line-height: 1.0; letter-spacing: -0.03em; margin-bottom: 24px; }
    .hero-title .cyan { color: var(--cyan); }
    .hero-title .mag { color: var(--magenta); }
    .hero-sub { font-size: 18px; color: var(--dim); max-width: 540px; line-height: 1.7; margin-bottom: 40px; font-weight: 300; }
    .hero-cta-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .btn-soon { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; font-family: var(--mono); font-size: 13px; letter-spacing: 0.06em; border: 1px solid rgba(192,132,252,0.4); color: var(--accent); background: rgba(192,132,252,0.08); cursor: not-allowed; }
    .btn-src { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; font-family: var(--mono); font-size: 13px; letter-spacing: 0.06em; border: 1px solid var(--rule); color: var(--dim); text-decoration: none; }
    .btn-src:hover { border-color: var(--ink); color: var(--ink); }
    .btn-dl { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; font-family: var(--mono); font-size: 13px; letter-spacing: 0.06em; border: 1px solid var(--accent); color: var(--bg); background: var(--accent); text-decoration: none; font-weight: 600; }
    .btn-dl:hover { background: #a855f7; border-color: #a855f7; }
    .hero-meta { display: flex; gap: 32px; flex-wrap: wrap; }
    .hero-meta-item { font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: 0.06em; }
    .hero-meta-item span { color: var(--ink); }

    /* SECTION BASE */
    .section { max-width: 1080px; margin: 0 auto; padding: 96px 48px; }
    .section-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--dim); margin-bottom: 20px; }
    .section-h { font-size: clamp(28px, 3.5vw, 44px); font-weight: 700; line-height: 1.15; letter-spacing: -0.025em; margin-bottom: 48px; }
    .divider { border: none; border-top: 1px solid var(--rule); max-width: 1080px; margin: 0 auto; }

    /* 3-LANE CONCEPT */
    .concept-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 2px; margin-bottom: 64px; }
    .lane-card { padding: 36px 28px; position: relative; overflow: hidden; }
    .lane-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .lane-card.transient { background: rgba(34,211,238,0.05); border: 1px solid rgba(34,211,238,0.15); }
    .lane-card.transient::before { background: var(--cyan); }
    .lane-card.tonal { background: rgba(232,121,249,0.05); border: 1px solid rgba(232,121,249,0.15); }
    .lane-card.tonal::before { background: var(--magenta); }
    .lane-card.full { background: rgba(192,132,252,0.05); border: 1px solid rgba(192,132,252,0.15); }
    .lane-card.full::before { background: linear-gradient(90deg, var(--cyan), var(--magenta)); }
    .lane-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; margin-bottom: 16px; }
    .lane-card.transient .lane-label { color: var(--cyan); }
    .lane-card.tonal .lane-label { color: var(--magenta); }
    .lane-card.full .lane-label { background: linear-gradient(90deg, var(--cyan), var(--magenta)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .lane-title { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    .lane-body { font-size: 14px; color: var(--dim); line-height: 1.7; }
    .lane-wave { height: 40px; margin: 20px 0 0; position: relative; overflow: hidden; opacity: 0.6; }
    .lane-wave svg { width: 100%; height: 100%; }

    /* EQUATION */
    .equation { display: flex; align-items: center; justify-content: center; gap: 24px; padding: 32px; background: var(--bg2); border: 1px solid var(--rule); font-family: var(--mono); font-size: 16px; flex-wrap: wrap; gap: 16px; }
    .eq-cyan { color: var(--cyan); }
    .eq-mag { color: var(--magenta); }
    .eq-op { color: var(--dim); }
    .eq-result { color: var(--ink); }
    .eq-note { font-size: 11px; color: var(--dim); margin-top: 8px; letter-spacing: 0.05em; }

    /* SCREENSHOT */
    .screenshot-section { max-width: 1200px; margin: 0 auto; padding: 0 24px 96px; }
    .screenshot-wrap { position: relative; border: 1px solid var(--rule); overflow: hidden; }
    .screenshot-wrap img { width: 100%; height: auto; display: block; }
    .screenshot-caption { display: flex; gap: 24px; padding: 16px 24px; background: var(--bg2); border-top: 1px solid var(--rule); flex-wrap: wrap; }
    .sc-cap-item { font-family: var(--mono); font-size: 11px; color: var(--dim); }
    .sc-cap-item span { color: var(--ink); }

    /* EFFECTS GRID */
    .fx-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
    .fx-card { background: var(--bg2); padding: 28px 24px; }
    .fx-num { font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: 0.1em; margin-bottom: 10px; }
    .fx-name { font-size: 16px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.01em; }
    .fx-cat { font-family: var(--mono); font-size: 10px; color: var(--accent); letter-spacing: 0.1em; margin-bottom: 12px; text-transform: uppercase; }
    .fx-body { font-size: 13px; color: var(--dim); line-height: 1.65; }
    .fx-params { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
    .fx-param { font-family: var(--mono); font-size: 10px; color: var(--dim); padding: 3px 8px; border: 1px solid var(--rule); letter-spacing: 0.05em; }

    /* WORKFLOW */
    .workflow-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); margin-bottom: 48px; }
    .wf-step { background: var(--bg2); padding: 28px 24px; }
    .wf-num { font-family: var(--mono); font-size: 36px; font-weight: 700; color: var(--accent); opacity: 0.3; margin-bottom: 12px; }
    .wf-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
    .wf-body { font-size: 13px; color: var(--dim); line-height: 1.6; }

    /* SPECS */
    .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
    .spec-group h3 { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--dim); margin-bottom: 20px; text-transform: uppercase; }
    .spec-row { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--rule); gap: 16px; }
    .spec-k { font-family: var(--mono); font-size: 12px; color: var(--dim); }
    .spec-v { font-family: var(--mono); font-size: 12px; color: var(--ink); text-align: right; }
    .spec-v.soon { color: var(--accent); }

    /* CTA */
    .cta-section { background: var(--bg2); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 96px 48px; text-align: center; }
    .cta-inner { max-width: 600px; margin: 0 auto; }
    .cta-title { font-size: clamp(32px, 4vw, 52px); font-weight: 800; line-height: 1.1; letter-spacing: -0.03em; margin-bottom: 20px; }
    .cta-sub { font-size: 16px; color: var(--dim); line-height: 1.7; margin-bottom: 40px; }
    .cta-soon-badge { display: inline-block; font-family: var(--mono); font-size: 13px; letter-spacing: 0.1em; color: var(--accent); padding: 12px 32px; border: 1px solid rgba(192,132,252,0.4); background: rgba(192,132,252,0.08); margin-bottom: 20px; }

    /* FOOTER */
    .page-footer { padding: 48px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--rule); }
    .footer-brand { font-family: var(--mono); font-size: 12px; color: var(--dim); }
    .footer-back { font-family: var(--mono); font-size: 12px; color: var(--dim); text-decoration: none; }
    .footer-back:hover { color: var(--ink); }

    @media (max-width: 768px) {
      .nav { padding: 16px 24px; }
      .hero-content, .section { padding-left: 24px; padding-right: 24px; }
      .concept-grid { grid-template-columns: 1fr; }
      .fx-grid { grid-template-columns: 1fr; }
      .workflow-steps { grid-template-columns: 1fr 1fr; }
      .specs-grid { grid-template-columns: 1fr; }
      .equation { font-size: 13px; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
  function useLang() {
    var [lang, setLang] = React.useState(function() { return localStorage.getItem("otodesk-lang") || "jp"; });
    var toggle = function() {
      var next = lang === "jp" ? "en" : "jp";
      localStorage.setItem("otodesk-lang", next);
      setLang(next);
    };
    return [lang, toggle];
  }

  /* Sine wave SVG paths */
  function TransientWave({ color }) {
    return (
      <svg viewBox="0 0 200 40" preserveAspectRatio="none">
        <polyline stroke={color} strokeWidth="1.5" fill="none" points="0,20 4,10 6,5 8,2 10,5 12,10 14,18 16,22 18,28 20,30 22,28 24,22 26,18 28,20 30,20 40,20 60,20 80,20 100,20 120,20 140,20 160,20 180,20 200,20" />
      </svg>
    );
  }
  function TonalWave({ color }) {
    return (
      <svg viewBox="0 0 200 40" preserveAspectRatio="none">
        <path stroke={color} strokeWidth="1.5" fill="none" d="M0,20 Q10,8 20,20 Q30,32 40,20 Q50,8 60,20 Q70,32 80,20 Q90,8 100,20 Q110,32 120,20 Q130,8 140,20 Q150,32 160,20 Q170,8 180,20 Q190,32 200,20" />
      </svg>
    );
  }

  function Nav({ lang, toggle }) {
    return (
      <nav className="nav">
        <a href="index.html" className="nav-logo">OTODE<span>SK</span></a>
        <div className="nav-right">
          <a href="index.html" className="nav-back">← {lang === "jp" ? "一覧に戻る" : "Back to index"}</a>
          <button className={"lang-btn" + (lang === "jp" ? " active" : "")} onClick={toggle}>JP</button>
          <button className={"lang-btn" + (lang === "en" ? " active" : "")} onClick={toggle}>EN</button>
        </div>
      </nav>
    );
  }

  function Hero({ lang }) {
    return (
      <section className="hero">
        <div className="hero-bg">
          <img src="screenshots/anatomy.jpg" alt="ANATOMY UI" />
          <div className="hero-bg-grad"></div>
        </div>
        <div className="hero-content">
          <div className="hero-badge">
            <span className="hero-badge-dot"></span>
            {lang === "jp" ? "VST3 · 6/21 公開" : "VST3 · RELEASED 6/21"}
          </div>
          <h1 className="hero-title">
            {lang === "jp"
              ? <><span className="cyan">サンプルを</span><br /><span className="mag">解剖しませんか？</span></>
              : <><span className="cyan">Dissect</span><br /><span className="mag">Your Samples.</span></>
            }
          </h1>
          <p className="hero-sub">
            {lang === "jp"
              ? "過渡音と音色を数学的に完璧に分離し、それぞれを独立したエフェクトチェーンで加工する。まったく新しい発想のサンプラー。"
              : "Mathematically perfect transient/tonal separation. Independent effect chains per lane. A sampler that dissects the anatomy of sound."}
          </p>
          <div className="hero-cta-row" style={{ marginBottom: "48px" }}>
            <a href="https://github.com/OTODESK4193/ANATOMY/releases" target="_blank" rel="noreferrer" className="btn-dl">{lang === "jp" ? "ダウンロード" : "Download"} →</a>
            <a href="https://github.com/OTODESK4193/ANATOMY" target="_blank" rel="noreferrer" className="btn-src">{lang === "jp" ? "ソースコード" : "Source"} →</a>
          </div>
          <div className="hero-meta">
            <div className="hero-meta-item">FORMAT <span>VST3</span></div>
            <div className="hero-meta-item">PLATFORM <span>Windows 64-bit</span></div>
            <div className="hero-meta-item">HOST <span>Ableton Live</span></div>
            <div className="hero-meta-item">LICENSE <span>AGPLv3</span></div>
            <div className="hero-meta-item">VERSION <span>v1.0.0</span></div>
          </div>
        </div>
      </section>
    );
  }

  function Concept({ lang }) {
    return (
      <div className="section">
        <div className="section-eyebrow">— 01 / {lang === "jp" ? "コアコンセプト" : "CORE CONCEPT"}</div>
        <h2 className="section-h">
          {lang === "jp"
            ? <><span style={{ color: "var(--cyan)" }}>cos²</span> クロスフェード分離</>
            : <><span style={{ color: "var(--cyan)" }}>cos²</span> Crossfade Separation</>}
        </h2>

        <div className="concept-grid">
          <div className="lane-card transient">
            <div className="lane-label">TRANSIENT LANE</div>
            <div className="lane-title">{lang === "jp" ? "打撃音" : "Attack"}</div>
            <div className="lane-body">{lang === "jp" ? "アタック・クリック・パーカッシブ成分。瞬間的なパンチとスナップ。" : "Percussive attack component — clicks, snaps, transient impact."}</div>
            <div className="lane-wave"><TransientWave color="var(--cyan)" /></div>
          </div>
          <div className="lane-card tonal">
            <div className="lane-label">TONAL LANE</div>
            <div className="lane-title">{lang === "jp" ? "持続音" : "Sustain"}</div>
            <div className="lane-body">{lang === "jp" ? "倍音・持続・音高のある成分。音の厚みと音色と減衰。" : "Sustained harmonic content — body, tone, and decay."}</div>
            <div className="lane-wave"><TonalWave color="var(--magenta)" /></div>
          </div>
          <div className="lane-card full">
            <div className="lane-label">FULL MIX LANE</div>
            <div className="lane-title">{lang === "jp" ? "再結合" : "Recombined"}</div>
            <div className="lane-body">{lang === "jp" ? "2色エネルギー比表示（シアン＝過渡、マゼンタ＝トーン）で分離バランスを可視化。" : "2-color energy ratio display — cyan for transient, magenta for tonal."}</div>
            <div className="lane-wave">
              <svg viewBox="0 0 200 40" preserveAspectRatio="none">
                <path stroke="var(--cyan)" strokeWidth="1.5" fill="none" d="M0,20 Q2,12 4,6 Q6,2 8,6 Q10,12 12,20" />
                <path stroke="var(--magenta)" strokeWidth="1.5" fill="none" d="M12,20 Q20,28 30,20 Q40,12 50,20 Q60,28 70,20 Q80,12 90,20 Q100,28 110,20 Q120,12 130,20 Q140,28 150,20 Q160,12 170,20 Q180,28 190,20 Q195,16 200,20" />
              </svg>
            </div>
          </div>
        </div>

        <div className="equation">
          <span className="eq-cyan">TRANSIENT</span>
          <span className="eq-op">+</span>
          <span className="eq-mag">TONAL</span>
          <span className="eq-op">=</span>
          <span className="eq-result">ORIGINAL INPUT</span>
          <div style={{ width: "100%", textAlign: "center" }}>
            <div className="eq-note">{lang === "jp" ? "エネルギー損失ゼロ・オーバーラップアーティファクトゼロを数学的に保証" : "Mathematically guaranteed zero energy loss and zero overlap artefacts"}</div>
          </div>
        </div>
      </div>
    );
  }

  function VideoSection({ lang }) {
    return (
      <div className="section" style={{ paddingTop: 0 }}>
        <hr className="divider" style={{ marginBottom: "96px", maxWidth: "none" }} />
        <div className="section-eyebrow">— {lang === "jp" ? "デモ動画" : "DEMO VIDEO"}</div>
        <h2 className="section-h">{lang === "jp" ? "動きで見る ANATOMY。" : "ANATOMY in motion."}</h2>
        <div style={{ position: "relative", width: "100%", aspectRatio: "16/9", background: "#0d0d12", border: "1px solid rgba(255,255,255,0.07)", overflow: "hidden" }}>
          <iframe
            width="100%" height="100%"
            src="https://www.youtube.com/embed/SJVZsBOG1pk?rel=0&modestbranding=1"
            title="ANATOMY Demo"
            frameBorder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowFullScreen
            style={{ display: "block", position: "absolute", inset: 0 }}
          />
        </div>
      </div>
    );
  }

  function Screenshot({ lang }) {
    return (
      <div className="screenshot-section">
        <div className="screenshot-wrap">
          <img src="screenshots/anatomy.jpg" alt="ANATOMY Plugin UI" />
          <div className="screenshot-caption">
            <div className="sc-cap-item"><span>{lang === "jp" ? "上段" : "Top"}</span> — {lang === "jp" ? "全コントロールとFULL MIXプレビュー" : "All controls + Full Mix 2-color preview"}</div>
            <div className="sc-cap-item"><span style={{ color: "var(--cyan)" }}>CYAN</span> — {lang === "jp" ? "トランジェント成分" : "Transient component"}</div>
            <div className="sc-cap-item"><span style={{ color: "var(--magenta)" }}>MAGENTA</span> — {lang === "jp" ? "トーン成分" : "Tonal component"}</div>
            <div className="sc-cap-item"><span>{lang === "jp" ? "右パネル" : "Right panel"}</span> — {lang === "jp" ? "レーン別エフェクトラック" : "Per-lane effect rack"}</div>
          </div>
        </div>
      </div>
    );
  }

  function Workflow({ lang }) {
    var steps = [
      { n: "01", t: { jp: "ロード", en: "Load" }, b: { jp: "WAVファイルをウィンドウにドラッグ＆ドロップ。自動で分析・分離。", en: "Drag & drop any WAV onto the plugin window. Auto-analyzed and separated instantly." } },
      { n: "02", t: { jp: "成形", en: "Shape" }, b: { jp: "Click Hold・Fade-In・Pitch・Gainを調整して分離特性を精密に制御。", en: "Adjust Click Hold, Fade-In, Pitch & Gain to sculpt the separation behaviour." } },
      { n: "03", t: { jp: "加工", en: "Process" }, b: { jp: "3レーン×6エフェクトで、各成分を独立してサチュレーション・圧縮・ノイズ付加。", en: "Apply up to 6 FX per lane — saturation, dynamics, noise — independently." } },
      { n: "04", t: { jp: "エクスポート", en: "Export" }, b: { jp: "EXPORTボタンで各レーンをWAVで書き出し。DAWにドラッグ＆ドロップで即時利用。", en: "Export each lane as WAV — drag directly into your DAW or sampler." } }
    ];
    return (
      <div className="section" style={{ paddingTop: 0 }}>
