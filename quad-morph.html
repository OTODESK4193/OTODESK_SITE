<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quad Morph Filter — 28 Filter Models | OTODESK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    :root {
      --ink: #f8f7f5;
      --ink-2: #ccc;
      --dim: #888;
      --bg: #0a0a0c;
      --rule: #222;
      --accent: #ff6b35;
      --spec-v: #00d9ff;
      --spec-y: #ffdd00;
      --spec-r: #ff1493;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", sans-serif;
      line-height: 1.65;
      letter-spacing: 0.01em;
    }
    .qmf-wrap {
      min-height: 100vh;
      overflow-x: hidden;
      background: linear-gradient(180deg, #0a0a0c 0%, #1a0f2e 100%);
    }

    /* ===== HEADER ===== */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 60px;
      border-bottom: 1px solid var(--rule);
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(10, 10, 12, 0.95);
      backdrop-filter: blur(8px);
    }
    .qmf-logo {
      font-size: 20px; font-weight: 700;
      letter-spacing: -0.02em;
      text-decoration: none;
      color: var(--ink);
    }
    .qmf-logo:hover { color: var(--accent); }
    .header-controls {
      display: flex; gap: 24px; align-items: center;
    }
    .lang-btn {
      background: none;
      border: 1px solid var(--rule);
      color: var(--dim);
      padding: 8px 12px;
      font-family: "Geist Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lang-btn:hover, .lang-btn.active { color: var(--accent); border-color: var(--accent); }
    .back-link {
      color: var(--dim);
      text-decoration: none;
      font-family: "Geist Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }

    /* ===== HERO ===== */
    .qmf-hero {
      position: relative;
      padding: 120px 60px;
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }
    .qmf-hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url('assets/quad-morph-screenshot.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
      filter: blur(0.5px) brightness(0.8);
    }
    .qmf-hero::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: 
        radial-gradient(ellipse 1200px 800px at 50% 0%, rgba(0, 217, 255, 0.15) 0%, transparent 60%),
        radial-gradient(ellipse 1200px 800px at 50% 100%, rgba(255, 20, 147, 0.1) 0%, transparent 60%);
      pointer-events: none;
      z-index: 1;
    }
    .qmf-hero-inner {
      position: relative;
      z-index: 2;
      max-width: 900px;
    }
    .qmf-hero-flag {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      font-family: "Geist Mono", monospace;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .qmf-flag-dot {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
    }
    .qmf-hero h1 {
      font-size: clamp(48px, 8vw, 84px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin: 0 0 18px;
      text-wrap: balance;
    }
    .qmf-hero-sub {
      font-size: 18px;
      color: var(--ink-2);
      line-height: 1.6;
      margin: 0 0 40px;
      text-wrap: balance;
      max-width: 700px;
    }
    .qmf-hero-cta {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 18px 32px;
      background: var(--accent);
      color: #000;
      border: 1px solid var(--accent);
      font-family: "Geist Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: filter 0.15s;
    }
    .qmf-hero-cta:hover { filter: brightness(1.12); }
    .qmf-soon { opacity: 0.6; cursor: not-allowed; }
    .qmf-soon:hover { filter: none; }

    /* ===== DEMO VIDEO ===== */
    .qmf-video-section {
      padding: 80px 60px;
      background: rgba(0, 217, 255, 0.05);
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }
    .qmf-video-wrap {
      max-width: 1000px;
      margin: 0 auto;
    }
    .qmf-video-placeholder {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, rgba(0,217,255,0.2) 0%, rgba(255,20,147,0.1) 100%);
      border: 1px solid var(--rule);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .qmf-video-placeholder::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(
        45deg, transparent, transparent 10px,
        rgba(255,107,53,0.1) 10px, rgba(255,107,53,0.1) 20px
      );
      animation: drift 20s linear infinite;
      pointer-events: none;
    }
    @keyframes drift {
      0% { transform: translate(-20px, -20px); }
      100% { transform: translate(20px, 20px); }
    }
    .qmf-video-icon {
      position: relative;
      z-index: 2;
      text-align: center;
    }
    .qmf-video-icon svg {
      width: 80px; height: 80px;
      margin-bottom: 16px;
      opacity: 0.6;
    }
    .qmf-video-label {
      font-family: "Geist Mono", monospace;
      font-size: 13px;
      letter-spacing: 0.12em;
      color: var(--dim);
      text-transform: uppercase;
    }

    /* ===== TAB SYSTEM ===== */
    .qmf-tabs-section {
      padding: 80px 60px;
      border-bottom: 1px solid var(--rule);
    }
    .qmf-tabs-header {
      max-width: 1200px;
      margin: 0 auto 48px;
    }
    .qmf-tabs-label {
      font-family: "Geist Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dim);
      margin-bottom: 16px;
    }
    .qmf-tabs-nav {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--rule);
    }
    .qmf-tab-btn {
      flex: 1;
      padding: 20px 28px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--dim);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: all 0.2s;
      text-align: left;
      font-family: "Noto Sans JP", sans-serif;
    }
    .qmf-tab-btn:hover { color: var(--ink); }
    .qmf-tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .qmf-tabs-content {
      max-width: 1200px;
      margin: 0 auto;
    }
    .qmf-tab-pane {
      display: none;
      animation: fadeIn 0.4s ease;
    }
    .qmf-tab-pane.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Tab Content Grids */
    .qmf-grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      margin-bottom: 48px;
    }
    .qmf-grid-3col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-bottom: 48px;
    }
    .qmf-card {
      padding: 32px;
      background: rgba(255, 107, 53, 0.08);
      border: 1px solid var(--rule);
      transition: all 0.2s;
    }
    .qmf-card:hover {
      background: rgba(255, 107, 53, 0.12);
      border-color: var(--accent);
    }
    .qmf-card-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      margin: 0 0 12px;
      letter-spacing: -0.01em;
    }
    .qmf-card-desc {
      font-size: 14px;
      color: var(--ink-2);
      line-height: 1.6;
      margin: 0;
    }

    /* Filter Model Table */
    .qmf-table-wrap {
      overflow-x: auto;
      margin: 48px 0;
    }
    .qmf-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .qmf-table thead {
      border-bottom: 2px solid var(--rule);
    }
    .qmf-table th {
      padding: 16px 12px;
      text-align: left;
      font-weight: 600;
      color: var(--dim);
      letter-spacing: 0.06em;
      font-family: "Geist Mono", monospace;
      text-transform: uppercase;
      font-size: 11px;
    }
    .qmf-table td {
      padding: 14px 12px;
      border-bottom: 1px solid var(--rule);
      color: var(--ink-2);
    }
    .qmf-table tbody tr:hover {
      background: rgba(255, 107, 53, 0.06);
    }
    .qmf-cat-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 3px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .qmf-cat-ladder { background: rgba(255, 107, 53, 0.2); color: #ff8b6a; }
    .qmf-cat-svf { background: rgba(0, 217, 255, 0.2); color: #4dd9ff; }
    .qmf-cat-analog { background: rgba(255, 221, 0, 0.2); color: #ffed4d; }
    .qmf-cat-digital { background: rgba(0, 255, 100, 0.2); color: #4dff7f; }
    .qmf-cat-spectral { background: rgba(255, 20, 147, 0.2); color: #ff6bb8; }
    .qmf-cat-exp { background: rgba(200, 100, 255, 0.2); color: #da9dff; }

    /* LFO Waveform Grid */
    .qmf-lfo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 16px;
      margin: 48px 0;
    }
    .qmf-lfo-tile {
      padding: 20px;
      background: rgba(0, 217, 255, 0.08);
      border: 1px solid var(--rule);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .qmf-lfo-tile:hover {
      background: rgba(0, 217, 255, 0.15);
      border-color: var(--spec-v);
    }
    .qmf-lfo-num {
      font-family: "Geist Mono", monospace;
      font-size: 13px;
      color: var(--spec-v);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .qmf-lfo-name {
      font-size: 12px;
      color: var(--ink);
      letter-spacing: 0.04em;
      font-weight: 500;
    }
    .qmf-lfo-cat {
      font-size: 10px;
      color: var(--dim);
      margin-top: 6px;
      font-family: "Geist Mono", monospace;
    }

    /* ===== SPECS FOOTER ===== */
    .qmf-specs {
      padding: 60px;
      background: rgba(0, 217, 255, 0.04);
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }
    .qmf-specs-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 32px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .qmf-spec-item { }
    .qmf-spec-k {
      font-family: "Geist Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--spec-v);
      margin-bottom: 8px;
    }
    .qmf-spec-v {
      font-size: 20px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
    }

    /* ===== FOOTER ===== */
    .qmf-footer {
      padding: 60px;
      border-top: 1px solid var(--rule);
      text-align: center;
    }
    .qmf-footer-text {
      color: var(--dim);
      font-size: 13px;
      margin: 12px 0;
    }
    .qmf-footer-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .qmf-footer-link {
      color: var(--accent);
      text-decoration: none;
      font-family: "Geist Mono", monospace;
      font-size: 12px;
      letter-spacing: 0.06em;
    }
    .qmf-footer-link:hover { text-decoration: underline; }

    @media (max-width: 1024px) {
      header { padding: 16px 32px; }
      .qmf-hero { padding: 80px 32px; }
      .qmf-tabs-section { padding: 60px 32px; }
      .qmf-grid-2col { grid-template-columns: 1fr; gap: 32px; }
      .qmf-grid-3col { grid-template-columns: 1fr 1fr; }
      .qmf-specs-grid { grid-template-columns: 1fr 1fr; gap: 24px; }
    }
    @media (max-width: 640px) {
      .qmf-hero h1 { font-size: 42px; }
      .qmf-hero-sub { font-size: 15px; }
      .qmf-tabs-nav { flex-wrap: wrap; }
      .qmf-tab-btn { padding: 14px 16px; font-size: 14px; }
      .qmf-grid-3col { grid-template-columns: 1fr; }
      .qmf-specs-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="qmf-wrap" id="app"></div>

<script type="text/babel">

      footer_developed: "Developed by OTODESK | GPLv3 Open Source",
      footer_back: "Back to OTODESK Site",

  const txt = t[lang];

  return (

          <button
            className={`lang-btn ${lang === 'en' ? 'active' : ''}`}

      <section className="qmf-hero">
        <div className="qmf-hero-inner">

          </div>
