<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OTODESK_Official_Site | VST Plugins</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/main.css" />
</head>
<body style="font-family: -apple-system; background-color: rgba(244, 172, 31, 0.184)">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data/plugins.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="components/visual.jsx"></script>
<script type="text/babel" src="components/counters.jsx"></script>
<script type="text/babel" src="components/sections.jsx"></script>

<script type="text/babel" data-presets="env,react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "accent": "#ff5b35",
  "lang": "jp"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [lang, setLang] = React.useState(tweaks.lang);

  React.useEffect(() => {
    document.body.classList.toggle("theme-dark", tweaks.theme === "dark");
    document.documentElement.style.setProperty("--accent", tweaks.accent);
  }, [tweaks.theme, tweaks.accent]);

  React.useEffect(() => {
    setLang(tweaks.lang);
  }, [tweaks.lang]);

  const onSelect = (id) => {
    const plugin = window.PLUGINS.find((p) => p.id === id);
    if (plugin) {
      window.location.href = plugin.featureUrl || ("plugin.html?id=" + id);
    }
  };

  const updateLang = (l) => {
    setLang(l);
    setTweak("lang", l);
  };

  return (
    <>
      <Header lang={lang} setLang={updateLang} />
      <main>
        <Hero lang={lang} />
        <NewsSection lang={lang} />
        <PluginGallery lang={lang} />
        <About lang={lang} />
      </main>
      <Footer lang={lang} />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme" />
        <TweakRadio label="Mode" value={tweaks.theme}
          options={["light","dark"]}
          onChange={(v) => setTweak("theme", v)} />
        <TweakSection label="Accent" />
        <TweakColor label="Color" value={tweaks.accent}
          options={["#00d4ff","#ff5b35","#c8ff00","#a78bfa","#ff3aa3"]}
          onChange={(v) => setTweak("accent", v)} />
        <TweakSection label="Language" />
        <TweakRadio label="Lang" value={tweaks.lang}
          options={["jp","en"]}
          onChange={(v) => setTweak("lang", v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
