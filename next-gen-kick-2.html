<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXT GEN KICK 2 — OTODESK | Professional Kick Synthesizer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600&family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #050507;
      --bg2: #0c0c0f;
      --bg3: #111116;
      --ink: #e8e6de;
      --dim: #64635e;
      --dim2: #888;
      --rule: rgba(255,255,255,0.06);
      --gold: #ffd166;
      --gold2: #ffba33;
      --orange: #ff8c42;
      --red: #ff4757;
      --accent: #ffd166;
      --mono: "Geist Mono", monospace;
      --sans: "Geist", system-ui, sans-serif;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    img { display: block; }

    /* NAV */
    .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 20px 48px; background: rgba(5,5,7,0.88); backdrop-filter: blur(14px); border-bottom: 1px solid var(--rule); }
    .nav-logo { font-family: var(--mono); font-size: 13px; letter-spacing: 0.14em; color: var(--dim2); text-decoration: none; }
    .nav-logo span { color: var(--ink); }
    .nav-right { display: flex; align-items: center; gap: 24px; }
    .nav-back { font-family: var(--mono); font-size: 12px; color: var(--dim2); letter-spacing: 0.05em; }
    .nav-back:hover { color: var(--ink); }
    .lang-btn { background: none; border: 1px solid var(--rule); color: var(--dim2); font-family: var(--mono); font-size: 11px; padding: 5px 10px; cursor: pointer; letter-spacing: 0.08em; transition: all 0.2s; }
    .lang-btn.active { border-color: var(--gold); color: var(--gold); }

    /* HERO */
    .hero { position: relative; min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 0 88px; overflow: hidden; }
    .hero-bg { position: absolute; inset: 0; }
    .hero-bg img { width: 100%; height: 100%; object-fit: cover; object-position: top center; opacity: 0.18; filter: saturate(1.2); }
    .hero-bg-grad { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(5,5,7,0.4) 0%, rgba(5,5,7,0.55) 35%, rgba(5,5,7,0.95) 78%, var(--bg) 100%); }
    .hero-content { position: relative; max-width: 1100px; margin: 0 auto; padding: 0 48px; width: 100%; }
    .hero-badge { display: inline-flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--gold); margin-bottom: 32px; padding: 7px 16px; border: 1px solid rgba(255,209,102,0.3); background: rgba(255,209,102,0.06); }
    .hero-badge-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    .hero-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; color: var(--dim2); margin-bottom: 16px; text-transform: uppercase; }
    .hero-title { font-size: clamp(52px, 7.5vw, 96px); font-weight: 800; line-height: 0.95; letter-spacing: -0.04em; margin-bottom: 28px; }
    .hero-title .gold { color: var(--gold); }
    .hero-title .orange { color: var(--orange); }
    .hero-sub { font-size: 17px; color: var(--dim2); max-width: 560px; line-height: 1.75; margin-bottom: 20px; font-weight: 300; }
    .hero-sub-em { color: var(--ink); font-weight: 500; }
    .hero-cta-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 56px; margin-top: 36px; }
    .btn-soon { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; font-family: var(--mono); font-size: 13px; letter-spacing: 0.06em; border: 1px solid rgba(255,209,102,0.35); color: var(--gold); background: rgba(255,209,102,0.07); cursor: default; }
    .btn-gh { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; font-family: var(--mono); font-size: 13px; letter-spacing: 0.06em; border: 1px solid var(--rule); color: var(--dim2); }
    .btn-gh:hover { border-color: var(--ink); color: var(--ink); }
    .btn-dl { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; font-family: var(--mono); font-size: 13px; letter-spacing: 0.06em; border: 1px solid var(--gold); color: var(--bg); background: var(--gold); font-weight: 700; }
    .btn-dl:hover { background: var(--gold2); border-color: var(--gold2); }
    .hero-meta { display: flex; gap: 36px; flex-wrap: wrap; }
    .hero-meta-item { font-family: var(--mono); font-size: 11px; color: var(--dim); letter-spacing: 0.06em; }
    .hero-meta-item span { color: var(--ink); margin-left: 6px; }

    /* SECTIONS */
    .section { max-width: 1100px; margin: 0 auto; padding: 96px 48px; }
    .section-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--dim2); margin-bottom: 18px; }
    .section-h { font-size: clamp(28px, 3.5vw, 48px); font-weight: 700; line-height: 1.1; letter-spacing: -0.03em; margin-bottom: 52px; }
    .gold-text { color: var(--gold); }
    .divider { border: none; border-top: 1px solid var(--rule); max-width: 1100px; margin: 0 auto; }

    /* LAYER CARDS */
    .layer-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 2px; margin-bottom: 48px; }
    .layer-card { padding: 36px 24px; position: relative; overflow: hidden; background: var(--bg2); border: 1px solid var(--rule); }
    .layer-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .layer-card.atk::before { background: var(--orange); }
    .layer-card.body::before { background: var(--gold); }
    .layer-card.sub::before { background: #7ecaff; }
    .layer-card.master::before { background: linear-gradient(90deg, var(--orange), var(--gold), #7ecaff); }
    .layer-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.16em; margin-bottom: 14px; }
    .layer-card.atk .layer-label { color: var(--orange); }
    .layer-card.body .layer-label { color: var(--gold); }
    .layer-card.sub .layer-label { color: #7ecaff; }
    .layer-card.master .layer-label { color: var(--dim2); }
    .layer-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.02em; }
    .layer-body { font-size: 13px; color: var(--dim2); line-height: 1.7; }
    .layer-wave { height: 36px; margin-top: 20px; opacity: 0.55; }
    .layer-wave svg { width: 100%; height: 100%; }

    /* SIGNAL CHAIN */
    .chain-box { display: flex; align-items: center; justify-content: center; gap: 0; flex-wrap: wrap; padding: 28px 32px; background: var(--bg2); border: 1px solid var(--rule); font-family: var(--mono); font-size: 12px; overflow-x: auto; }
    .chain-node { padding: 10px 16px; border: 1px solid var(--rule); color: var(--dim2); white-space: nowrap; }
    .chain-node.active { border-color: rgba(255,209,102,0.4); color: var(--gold); background: rgba(255,209,102,0.06); }
    .chain-arrow { color: var(--dim); padding: 0 8px; font-size: 14px; }

    /* SCREENSHOTS */
    .shot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
    .shot-wrap { position: relative; overflow: hidden; background: var(--bg2); border: 1px solid var(--rule); }
    .shot-wrap img { width: 100%; height: auto; display: block; transition: transform 0.4s ease; }
    .shot-wrap:hover img { transform: scale(1.02); }
    .shot-cap { padding: 14px 18px; background: var(--bg2); border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; }
    .shot-cap-label { font-family: var(--mono); font-size: 10px; color: var(--gold); letter-spacing: 0.12em; }
    .shot-cap-desc { font-family: var(--mono); font-size: 10px; color: var(--dim2); }

    /* FX TABLE */
    .fx-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--rule); border: 1px solid var(--rule); }
    .fx-card { background: var(--bg2); padding: 28px 22px; }
    .fx-num { font-family: var(--mono); font-size: 10px; color: var(--dim); letter-spacing: 0.12em; margin-bottom: 10px; }
    .fx-name { font-size: 15px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.01em; }
    .fx-cat { font-family: var(--mono); font-size: 10px; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 12px; }
    .fx-body { font-size: 13px; color: var(--dim2); line-height: 1.65; }
    .fx-params { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 5px; }
    .fx-param { font-family: var(--mono); font-size: 10px; color: var(--dim2); padding: 3px 8px; border: 1px solid var(--rule); }

    /* ENVELOPE */
    .env-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; margin-bottom: 48px; }
    .env-card { background: var(--bg2); border: 1px solid var(--rule); padding: 32px 28px; }
    .env-card-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .env-card-sub { font-family: var(--mono); font-size: 10px; color: var(--gold); letter-spacing: 0.1em; margin-bottom: 16px; }
    .env-card-body { font-size: 13px; color: var(--dim2); line-height: 1.7; }
    .presets-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
    .preset-chip { font-family: var(--mono); font-size: 10px; padding: 4px 10px; border: 1px solid var(--rule); color: var(--dim2); letter-spacing: 0.04em; }
    .preset-chip.gold { border-color: rgba(255,209,102,0.35); color: var(--gold); background: rgba(255,209,102,0.05); }

    /* PRESETS TABLE */
    .preset-cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; background: var(--rule); border: 1px solid var(--rule); }
    .pcat-card { background: var(--bg2); padding: 24px 20px; }
    .pcat-label { font-family: var(--mono); font-size: 10px; color: var(--gold); letter-spacing: 0.12em; margin-bottom: 12px; }
    .pcat-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
    .pcat-body { font-size: 12px; color: var(--dim2); line-height: 1.65; }
    .pcat-count { font-family: var(--mono); font-size: 26px; font-weight: 700; color: var(--gold); opacity: 0.35; margin-bottom: 4px; }

    /* ANALYZER */
    .analyzer-vis { position: relative; height: 160px; background: var(--bg2); border: 1px solid var(--rule); overflow: hidden; margin-bottom: 32px; }
    .analyzer-bars { display: flex; align-items: flex-end; gap: 2px; height: 100%; padding: 12px 12px 0; }
    .a-bar { flex: 1; border-radius: 1px 1px 0 0; min-width: 2px; }
    .analyzer-label { position: absolute; top: 10px; right: 12px; font-family: var(--mono); font-size: 10px; color: var(--gold); letter-spacing: 0.1em; }
    .analyzer-grid-line { position: absolute; left: 0; right: 0; border-top: 1px solid rgba(255,255,255,0.04); }
    .freq-ticks { display: flex; justify-content: space-between; padding: 6px 12px; font-family: var(--mono); font-size: 9px; color: var(--dim); }

    /* SPECS */
    .specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
    .spec-group h3 { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: var(--dim); margin-bottom: 20px; text-transform: uppercase; }
    .spec-row { display: flex; justify-content: space-between; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--rule); gap: 16px; }
    .spec-k { font-family: var(--mono); font-size: 12px; color: var(--dim2); }
    .spec-v { font-family: var(--mono); font-size: 12px; color: var(--ink); text-align: right; }
    .spec-v.soon { color: var(--gold); }

    /* CTA */
    .cta-section { background: var(--bg2); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 108px 48px; text-align: center; }
    .cta-inner { max-width: 640px; margin: 0 auto; }
    .cta-badge { display: inline-block; font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; color: var(--gold); padding: 10px 28px; border: 1px solid rgba(255,209,102,0.35); background: rgba(255,209,102,0.06); margin-bottom: 32px; }
    .cta-title { font-size: clamp(36px, 5vw, 64px); font-weight: 800; line-height: 1.0; letter-spacing: -0.04em; margin-bottom: 20px; }
    .cta-sub { font-size: 16px; color: var(--dim2); line-height: 1.75; margin-bottom: 44px; }
    .cta-links { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .cta-follow { margin-top: 36px; font-family: var(--mono); font-size: 12px; color: var(--dim); }
    .cta-follow a { color: var(--dim2); border-bottom: 1px solid var(--rule); padding-bottom: 1px; }
    .cta-follow a:hover { color: var(--gold); border-color: var(--gold); }

    /* FOOTER */
    .page-footer { padding: 44px 48px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--rule); }
    .footer-brand { font-family: var(--mono); font-size: 12px; color: var(--dim); }
    .footer-back { font-family: var(--mono); font-size: 12px; color: var(--dim2); }
    .footer-back:hover { color: var(--ink); }

    /* COMPARE BOX */
    .compare-row { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; background: var(--rule); border: 1px solid var(--rule); margin-bottom: 48px; }
    .compare-cell { background: var(--bg2); padding: 28px 24px; }
    .compare-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; margin-bottom: 16px; }
    .compare-cell.v1 .compare-label { color: var(--dim2); }
    .compare-cell.v2 .compare-label { color: var(--gold); }
    .compare-list { list-style: none; }
    .compare-list li { font-size: 13px; color: var(--dim2); line-height: 1.7; padding: 4px 0; border-bottom: 1px solid var(--rule); display: flex; gap: 10px; }
    .compare-list li::before { content: "—"; color: var(--dim); flex-shrink: 0; }
    .compare-cell.v2 .compare-list li { color: var(--ink); }
    .compare-cell.v2 .compare-list li::before { content: "✦"; color: var(--gold); }

    @media (max-width: 800px) {
      .nav { padding: 16px 20px; }
      .hero-content, .section { padding-left: 20px; padding-right: 20px; }
      .layer-grid { grid-template-columns: 1fr 1fr; }
      .shot-grid { grid-template-columns: 1fr; }
      .fx-grid { grid-template-columns: 1fr 1fr; }
      .env-grid, .specs-grid, .compare-row { grid-template-columns: 1fr; }
      .preset-cats { grid-template-columns: 1fr 1fr; }
      .chain-box { font-size: 10px; }
      .page-footer { flex-direction: column; gap: 16px; text-align: center; }
    }
    @media (max-width: 500px) {
      .layer-grid { grid-template-columns: 1fr; }
      .fx-grid { grid-template-columns: 1fr; }
      .preset-cats { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
  function useLang() {
    var [lang, setLang] = React.useState(function() {
      return localStorage.getItem("otodesk-lang") || "jp";
    });
    var toggle = function() {
      var next = lang === "jp" ? "en" : "jp";
      localStorage.setItem("otodesk-lang", next);
      setLang(next);
    };
    return [lang, toggle];
  }

  /* Waveform SVGs */
  function AtkWave() {
    return (
      <svg className="layer-wave" viewBox="0 0 200 36" preserveAspectRatio="none">
        <polyline stroke="var(--orange)" strokeWidth="1.5" fill="none"
          points="0,18 3,12 5,4 7,1 9,4 11,10 14,16 18,20 24,22 32,22 50,20 80,19 120,18 160,18 200,18" />
      </svg>
    );
  }
  function BodyWave() {
    return (
      <svg className="layer-wave" viewBox="0 0 200 36" preserveAspectRatio="none">
        <path stroke="var(--gold)" strokeWidth="1.5" fill="none"
          d="M0,18 C6,4 10,2 16,12 C22,22 28,28 40,24 C55,18 80,14 120,17 C155,18 180,18 200,18" />
      </svg>
    );
  }
  function SubWave() {
    return (
      <svg className="layer-wave" viewBox="0 0 200 36" preserveAspectRatio="none">
        <path stroke="#7ecaff" strokeWidth="1.5" fill="none"
          d="M0,18 Q10,6 20,18 Q30,30 40,18 Q50,6 60,18 Q70,30 80,18 Q90,6 100,18 Q110,30 120,18 Q130,6 140,18 Q150,30 160,18 Q175,6 190,18 Q196,22 200,18" />
      </svg>
    );
  }
  function MasterWave() {
    return (
      <svg className="layer-wave" viewBox="0 0 200 36" preserveAspectRatio="none">
        <path stroke="var(--gold)" strokeWidth="1" fill="none" opacity="0.5"
          d="M0,18 C4,4 8,2 12,10 C16,18 22,26 32,22 C45,16 70,14 100,17 C130,18 160,18 200,18" />
        <path stroke="#7ecaff" strokeWidth="1" fill="none" opacity="0.5"
          d="M0,18 Q12,8 24,18 Q36,28 48,18 Q60,8 72,18 Q84,28 96,18 Q108,8 120,18 Q140,22 160,18 Q180,14 200,18" />
      </svg>
    );
  }

  /* Fake analyzer bars */
  function AnalyzerViz() {
    var bands = 60;
    var freqs = ["20", "50", "100", "200", "500", "1k", "2k", "5k", "10k", "20k"];
    var heights = React.useMemo(function() {
      return Array.from({ length: bands }, function(_, i) {
        var f = i / bands;
        var h = f < 0.15 ? 0.85 - f * 2 + Math.random() * 0.1
              : f < 0.35 ? 0.65 - f * 0.8 + Math.random() * 0.15
              : f < 0.6  ? 0.35 - f * 0.3 + Math.random() * 0.18
              : 0.15 + Math.random() * 0.12;
        return Math.max(0.04, Math.min(0.96, h));
      });
    }, []);
    var getColor = function(i) {
      var f = i / bands;
      if (f < 0.12) return "rgba(255,70,70,0.8)";
      if (f < 0.28) return "rgba(255,180,50,0.8)";
      if (f < 0.55) return "rgba(120,220,80,0.8)";
      return "rgba(100,200,255,0.8)";
    };
    return (
      <div className="analyzer-vis">
        {[25, 50, 75].map(function(y) {
          return <div key={y} className="analyzer-grid-line" style={{ top: y + "%" }} />;
        })}
        <div className="analyzer-bars">
          {heights.map(function(h, i) {
            return (
              <div key={i} className="a-bar"
                style={{ height: (h * 100) + "%", background: getColor(i) }} />
            );
          })}
        </div>
        <div className="analyzer-label">480 BANDS · Fund: E1 · 41 Hz</div>
      </div>
    );
  }

  function Nav({ lang, toggle }) {
    return (
      <nav className="nav">
        <a href="index.html" className="nav-logo">OTODE<span>SK</span></a>
        <div className="nav-right">
          <a href="index.html" className="nav-back">← {lang === "jp" ? "一覧に戻る" : "Back to index"}</a>
          <button className={"lang-btn" + (lang === "jp" ? " active" : "")} onClick={toggle}>JP</button>
          <button className={"lang-btn" + (lang === "en" ? " active" : "")} onClick={toggle}>EN</button>
        </div>
      </nav>
    );
  }

  function Hero({ lang }) {
    return (
      <section className="hero">
        <div className="hero-bg">
          <img src="screenshots/NextGenKick2Main.jpg" alt="NEXT GEN KICK 2 UI" />
          <div className="hero-bg-grad" />
        </div>
        <div className="hero-content">
          <div className="hero-badge">
            <span className="hero-badge-dot" />
            {lang === "jp" ? "VST3 · Coming Soon" : "VST3 · Coming Soon"}
          </div>
          <div className="hero-eyebrow">NEXT GEN KICK 2 — OTODESK / 2026</div>
          <h1 className="hero-title">
            {lang === "jp"
              ? <><span className="gold">最強の</span><br /><span className="orange">キックシンセ</span><br />降臨。</>
              : <><span className="gold">The Ultimate</span><br /><span className="orange">Kick Synth</span><br />is here.</>
            }
          </h1>
          <p className="hero-sub">
            {lang === "jp"
              ? <><span className="hero-sub-em">NEXT GEN KICK から 7 ヶ月。</span>AI との対話による開発で積み上げてきた全てのノウハウを、この一本に注ぎ込んだ最高傑作。3 層合成エンジン、70 ファクトリプリセット、480 バンドアナライザ——頭の中にあるキックを、全てゼロレイテンシで形にする。</>
              : <><span className="hero-sub-em">Seven months after NEXT GEN KICK.</span> Every lesson from AI-assisted development distilled into one masterpiece. Three synthesis layers, 70 factory presets, 480-band analyzer — design any kick in your head at zero latency.</>
            }
          </p>
          <div className="hero-cta-row">
            <span className="btn-soon">⏳ {lang === "jp" ? "Coming Soon" : "Coming Soon"}</span>
            <a href="https://github.com/OTODESK4193/NextGenKick2" target="_blank" rel="noreferrer" className="btn-gh">GitHub ↗</a>
